name: Build Python App (Nuitka, Cross‑Platform)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync dependencies
        run: uv sync

      - name: Install Dependency Walker (Windows)
        if: runner.os == 'Windows'
        run: |
          curl -L -o depends.zip https://dependencywalker.com/depends22_x64.zip
          unzip depends.zip -d $HOME/depends
          echo "$HOME/depends" >> $GITHUB_PATH

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential patchelf

      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH

      - name: Compile with Nuitka (Linux)
        if: runner.os == 'Linux'
        run: |
          uv run python -m nuitka \
            --standalone \
            --onefile \
            --enable-plugin=pyside6 \
            --output-filename=familybudget \
            --include-data-dir=src/locales=locales \
            --include-data-dir=src/ui/shared=ui/shared \
            --include-data-file=src/ui/shared/icon.svg=ui/shared/icon.svg \
            --include-data-file=src/ui/shared/icon.ico=ui/shared/icon.ico \
            --include-data-file=src/ui/shared/icon.icns=ui/shared/icon.icns \
            --output-dir=build \
            src/main.py

      - name: Compile with Nuitka (macOS)
        if: runner.os == 'macOS'
        run: |
          uv run python -m nuitka \
            --standalone \
            --onefile \
            --enable-plugin=pyside6 \
            --output-filename=familybudget \
            --macos-app-icon=src/ui/shared/icon.icns \
            --include-data-dir=src/locales=locales \
            --include-data-dir=src/ui/shared=ui/shared \
            --include-data-file=src/ui/shared/icon.svg=ui/shared/icon.svg \
            --include-data-file=src/ui/shared/icon.ico=ui/shared/icon.ico \
            --include-data-file=src/ui/shared/icon.icns=ui/shared/icon.icns \
            --output-dir=build \
            src/main.py

      - name: Compile with Nuitka (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv run python -m nuitka `
            --standalone `
            --onefile `
            --disable-ccache `
            --clean-cache=all `
            --enable-plugin=pyside6 `
            --output-filename=familybudget `
            --windows-icon-from-ico=src/ui/shared/icon.ico `
            --include-data-dir=src/locales=locales `
            --include-data-dir=src/ui/shared=ui/shared `
            --include-data-file=src/ui/shared/icon.svg=ui/shared/icon.svg `
            --include-data-file=src/ui/shared/icon.ico=ui/shared/icon.ico `
            --include-data-file=src/ui/shared/icon.icns=ui/shared/icon.icns `
            --disable-dll-dependency-cache `
            --assume-yes-for-downloads `
            --output-dir=build `
            src/main.py

      - name: Clean build folders (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          rm -rf build/main.build
          rm -rf build/main.dist
          rm -rf build/main.onefile-build

      - name: Clean build folders (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build\main.build -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force build\main.dist -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force build\main.onefile-build -ErrorAction SilentlyContinue

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: familybudget-${{ matrix.os }}
          path: build/