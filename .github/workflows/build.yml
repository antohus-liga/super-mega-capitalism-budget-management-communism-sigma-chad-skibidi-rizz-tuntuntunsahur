name: Build App

on:
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UV
        uses: astral-sh/setup-uv@v1

      - name: Install dependencies
        run: uv sync
        env:
          UV_PYTHON_PREFER_SYSTEM: "1"

      - name: Make build script executable
        run: chmod +x builds/linux/build.sh

      - name: Build Linux executable
        run: uv run bash builds/linux/build.sh
        env:
          UV_PYTHON_PREFER_SYSTEM: "1"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: builds/linux/dist/

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UV
        uses: astral-sh/setup-uv@v1

      - name: Install dependencies
        run: uv sync
        env:
          UV_PYTHON_PREFER_SYSTEM: "1"

      - name: Make build script executable
        run: chmod +x builds/macos/build.sh

      - name: Build macOS executable
        run: uv run bash builds/macos/build.sh
        env:
          UV_PYTHON_PREFER_SYSTEM: "1"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: builds/macos/dist/

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UV
        uses: astral-sh/setup-uv@v1

      - name: Install dependencies
        run: uv sync
        env:
          UV_PYTHON_PREFER_SYSTEM: "1"

      - name: Build Windows executable
        run: uv run python builds/windows/build.py
        env:
          UV_PYTHON_PREFER_SYSTEM: "1"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: builds/windows/dist/